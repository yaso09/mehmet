name: validate

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  self-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run mehmet self-check
        run: python3 scripts/self_check.py

      - name: Validate JSON config
        run: python3 -m json.tool opencode.json > /dev/null

      - name: Validate workflow YAML syntax
        run: |
          python3 -c "import yaml" 2>/dev/null || pip install --quiet pyyaml
          python3 -c "
          import glob, yaml
          for f in glob.glob('.github/workflows/*.yml'):
              with open(f) as fh:
                  yaml.safe_load(fh)
              print('OK', f)
          "