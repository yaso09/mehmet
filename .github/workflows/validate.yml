name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  project-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Validate project files and escape readiness
        run: python3 scripts/validate.py --strict