name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Run maturity check
        run: python3 scripts/maturity.py --fail-below 70

      - name: Validate workflow YAML syntax
        run: |
          python3 - <<'EOF'
          import sys, glob
          try:
              import yaml
          except ImportError:
              print("PyYAML unavailable; skipping YAML validation")
              sys.exit(0)
          for path in glob.glob(".github/workflows/*.yml"):
              with open(path) as fh:
                  yaml.safe_load(fh)
              print(f"OK {path}")
          EOF