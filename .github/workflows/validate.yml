name: validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Yapısal doğrulama
        run: bash scripts/validate.sh

      - name: Olgunluk / kaçış metrikleri
        run: bash scripts/check-maturity.sh --quiet