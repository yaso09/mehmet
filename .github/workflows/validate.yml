name: validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate JSON syntax
        run: |
          for f in $(find . -name '*.json' -not -path './.git/*'); do
            python3 -c "import json,sys; json.load(open('$f'))" || exit 1
          done

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate YAML syntax
        run: |
          python3 -c "import yaml" && \
          for f in $(find . -name '*.yml' -o -name '*.yaml' | grep -v '^./.git/'); do
            python3 -c "import yaml,sys; yaml.safe_load(open('$f'))" || exit 1
          done

      - name: Run repo integrity check
        run: python3 scripts/validate.py