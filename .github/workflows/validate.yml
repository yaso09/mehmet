name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Proje bütünlük doğrulaması
        run: bash scripts/validate.sh

      - name: Test altyapısı
        run: bash tests/run_tests.sh

      - name: Olgunluk değerlendirmesi
        run: bash scripts/maturity.sh
