name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Bütünlük testleri
        run: python3 -m unittest discover -s tests -v

      - name: Olgunluk / kaçış denetimi
        run: python3 scripts/check_maturity.py