name: validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pyyaml

      - name: Run project validation
        run: python3 scripts/validate.py

      - name: Lint YAML files
        run: |
          yamllint -f parsable .github/workflows/*.yml

      - name: Notify on failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const body = "Validation workflow failed on latest scheduled run. Run `python3 scripts/validate.py` locally and fix issues.";
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "🛠 Project validation failed",
              body: body,
            });
