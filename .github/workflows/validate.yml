name: validate

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: YAML lint workflow files
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: .github/workflows/opencode.yml
          config_data: |
            extends: default
            rules:
              line-length: disable
              document-start: disable
              truthy:
                check-keys: false

      - name: Run project validation
        run: scripts/validate.sh
