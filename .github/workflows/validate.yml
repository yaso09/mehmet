name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  maturity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run maturity check
        run: python3 scripts/maturity.py

      - name: Verify quiet mode
        run: python3 scripts/maturity.py --quiet | python3 -c "import sys,json; d=json.load(sys.stdin); print(f\"score={d['score']}/{d['max']} level={d['level']}\")"