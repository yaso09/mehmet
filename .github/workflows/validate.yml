name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup tools
        run: |
          pip install --quiet pyyaml
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck >/dev/null

      - name: Run validation
        run: make validate
