name: validate

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run consistency checks
        run: python3 scripts/check.py

      - name: Run self-tests
        run: python3 -m unittest discover -s scripts/tests

      - name: Report maturity score
        run: python3 scripts/maturity.py

      - name: Makefile targets are reachable
        run: make all