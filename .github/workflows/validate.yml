name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Proje sağlık doğrulama
        run: python3 scripts/validate.py

      - name: Olgunluk skoru raporu
        run: |
          python3 scripts/maturity.py || echo "::warning::Olgunluk skoru kaçış eşiğinin (80) altında — geliştirmeye devam et."
