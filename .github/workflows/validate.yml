name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run project health check
        run: python3 scripts/check_project.py
      - name: Run unit tests
        run: python3 -m unittest discover -s scripts