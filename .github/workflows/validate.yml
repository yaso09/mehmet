name: validate

on:
  push:
  pull_request:

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Proje sağlık ve olgunluk kontrolü
        run: python3 scripts/health_check.py --fail-below 90