name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run project validation
        run: bash scripts/validate.sh

      - name: Ensure script is executable
        run: test -x scripts/validate.sh || chmod +x scripts/validate.sh