name: validate

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Syntax check scripts
        run: python3 -m py_compile scripts/maturity.py

      - name: Maturity check
        run: python3 scripts/maturity.py --threshold 22