name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Proje sağlık kontrolü
        run: bash scripts/validate.sh

      - name: Olgunluk skoru
        run: bash scripts/check-maturity.sh