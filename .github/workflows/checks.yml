name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Proje doğrulama ve olgunluk skoru
        run: python3 tests/validate.py
      - name: Kaçış eşiği raporu
        if: always()
        run: python3 tests/validate.py || true