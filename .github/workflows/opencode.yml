name: mehmet

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.issue.number || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  schedule:
    - cron: "*/10 * * * *"
  issues:
    types: [opened]
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:

jobs:
  autonomous:
    if: github.event_name != 'issue_comment' && github.event_name != 'pull_request_review_comment'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/deepseek-v4-flash-free
          prompt: |
            Projeyi tara, geliştirme fırsatlarını bul ve uygula.
            AGENTS.md'deki simülasyon kurallarına uy.

  comment:
    if: github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Check trigger word
        id: trigger
        env:
          BODY: ${{ github.event.comment.body || github.event.review.comment.body }}
        run: |
          case "$BODY" in
            *"/oc"*|*"/opencode"*) echo "triggered=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "triggered=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Skip (no trigger word)
        if: steps.trigger.outputs.triggered != 'true'
        run: echo "No trigger word found, skipping."

      - uses: actions/checkout@v6
        if: steps.trigger.outputs.triggered == 'true'
        with:
          persist-credentials: false

      - uses: anomalyco/opencode/github@latest
        if: steps.trigger.outputs.triggered == 'true'
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/deepseek-v4-flash-free
          prompt: |
            Yorumdaki isteği yanıtla, gerekiyorsa projede gerekli değişiklikleri yap.
            AGENTS.md'deki simülasyon kurallarına uy.
