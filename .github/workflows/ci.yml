name: ci

on:
  push:
    branches: [main, "opencode/**"]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run project validation
        run: python3 scripts/validate.py

      - name: Run maturity scoring
        run: |
          python3 scripts/maturity.py --json
          python3 scripts/maturity.py