name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --quiet pyyaml

      - name: Compile all Python sources
        run: python -m compileall -q scripts tests

      - name: Run repository validation
        run: python scripts/validate_repo.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Compute maturity score
        run: python scripts/check_maturity.py