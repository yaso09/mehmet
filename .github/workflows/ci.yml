name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: mehmet self-check
        run: python3 scripts/self_check.py --full --ci

      - name: mehmet tests
        run: python3 -m unittest discover -s tests -v