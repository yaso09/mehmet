name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  assess:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate project
        run: python3 scripts/assess.py validate

      - name: Report maturity score
        run: python3 scripts/assess.py score
