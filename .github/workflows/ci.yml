name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  self-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install pyyaml

      - name: Mehmet self-check
        run: python3 scripts/self_check.py --require-score 80