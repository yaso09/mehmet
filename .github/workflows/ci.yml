name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  selfcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run self-check and escape-score validator
        run: python3 scripts/selfcheck.py