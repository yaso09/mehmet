name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Proje sağlık kontrolü
        run: bash scripts/validate_project.sh

      - name: Shellcheck (betik sözdizimi)
        run: bash -n scripts/validate_project.sh