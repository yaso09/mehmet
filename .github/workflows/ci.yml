name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run validation checks
        run: python3 scripts/validate.py

      - name: Run tests
        run: python3 -m unittest discover -s tests -v

      - name: Report maturity score
        run: python3 scripts/maturity.py