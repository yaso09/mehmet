name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Lint
        run: npm run lint

      - name: Testleri çalıştır
        run: npm test

      - name: Olgunluk değerlendirmesi
        run: node scripts/check-maturity.js || true
