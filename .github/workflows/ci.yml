name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Project integrity check
        run: python3 scripts/validate.py

      - name: Escape maturity score
        run: |
          python3 scripts/maturity.py || echo "MATURITY_BELOW_THRESHOLD=true" >> "$GITHUB_ENV"

      - name: Maturity summary
        if: always()
        run: |
          if [ "$MATURITY_BELOW_THRESHOLD" = "true" ]; then
            echo "⚠  Kaçış eşiğine ulaşılamadı. scripts/maturity.py çıktısını incele."
          else
            echo "🎉 Kaçış olgunluğu eşiği aşıldı!"
          fi