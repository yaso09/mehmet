name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Maturity assessment
        run: python scripts/maturity.py . --threshold 80

      - name: Validate opencode.json
        run: python -m json.tool opencode.json > /dev/null