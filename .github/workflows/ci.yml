name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run test suite
        run: python3 -m unittest discover -s tests -v

      - name: Check maturity score
        run: python3 scripts/maturity.py

      - name: Validate workflow YAML
        run: |
          python3 -c "
          import yaml
          for wf in ['opencode.yml', 'ci.yml']:
              with open(f'.github/workflows/{wf}') as f:
                  yaml.safe_load(f)
              print(f'OK: {wf}')
          "
