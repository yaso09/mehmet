name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate opencode.json
        run: python -c "import json; json.load(open('opencode.json'))"

      - name: Validate YAML files
        run: |
          python - <<'EOF'
          import glob
          import yaml
          for path in glob.glob(".github/workflows/*.yml") + glob.glob(".github/workflows/*.yaml"):
              with open(path) as fh:
                  yaml.safe_load(fh)
              print(f"OK: {path}")
          EOF