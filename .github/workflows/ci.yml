name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Proje tutarlılığını doğrula
        run: python3 scripts/validate.py

      - name: Kaçış olgunluk skorunu hesapla
        run: python3 scripts/escape_status.py