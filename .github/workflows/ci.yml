name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  self-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run self-check
        run: |
          python3 scripts/self_check.py

      - name: Run tests
        run: |
          python3 -m unittest discover -s tests -v

      - name: Validate workflow syntax
        uses: rhysd/actionlint@v1
