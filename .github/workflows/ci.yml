name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python -m pip install --quiet pyyaml

      - name: Validate opencode.json
        run: python -m json.tool opencode.json > /dev/null

      - name: Validate workflow YAML syntax
        run: python scripts/validate.py --check-yaml

      - name: Check line endings / trailing whitespace
        run: |
          if git diff --check --exit-code; then
            echo "No whitespace errors"
          else
            exit 1
          fi
