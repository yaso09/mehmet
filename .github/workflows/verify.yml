name: verify

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  maturity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Olgunluk doğrulaması çalıştır
        run: |
          chmod +x scripts/verify.sh
          ./scripts/verify.sh --ci