name: verify

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Doğrulama betiklerini çalıştır
        run: bash scripts/verify.sh

      - name: Olgunluk raporu
        run: bash scripts/maturity.sh