name: verify

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml

      - name: Run project health verification
        run: bash scripts/verify.sh