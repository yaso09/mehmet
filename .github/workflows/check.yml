name: repo-check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Repo saglik kontrolu ve olgunluk skoru
        run: bash scripts/check-repo.sh