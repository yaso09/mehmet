name: assess

on:
  push:
    branches: ["**"]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run escape readiness assessment
        run: |
          python scripts/assess.py --threshold 80
          python scripts/assess.py --json > /tmp/assess-report.json

      - name: Upload assessment report
        uses: actions/upload-artifact@v4
        with:
          name: assessment-report
          path: /tmp/assess-report.json
        if: always()