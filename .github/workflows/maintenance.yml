name: maintenance

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: maintenance
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --quiet pyyaml

      - name: Run repository validation
        run: python scripts/validate_repo.py

      - name: Generate maturity report
        run: python scripts/check_maturity.py --report docs/maturity-report.md

      - name: Commit report if changed
        run: |
          git config user.name "mehmet[bot]"
          git config user.email "mehmet[bot]@users.noreply.github.com"
          git add docs/maturity-report.md
          if git diff --cached --quiet; then
            echo "No changes to maturity report."
          else
            git commit -m "docs: update maturity report"
            git push
          fi