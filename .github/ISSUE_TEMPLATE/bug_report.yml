name: Bug report
description: Bir hata bildirin
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Hata açıklaması
      description: Ne oldu, ne bekleniyordu?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Tekrarlama adımları
      description: Hatayı nasıl tekrarlayabiliriz?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Ek bilgi
      description: Log çıktısı, ortam bilgisi vb.
