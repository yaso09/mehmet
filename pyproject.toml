[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mehmet"
version = "0.3.0"
description = "Kendi kendini geliştiren otonom ajanın çekirdek modülü."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
dependencies = []

[project.scripts]
mehmet = "mehmet.report:main"

[tool.setuptools.packages.find]
include = ["mehmet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"