[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mehmet"
version = "0.3.0"
description = "Kendi kendini geliştiren otonom AI ajanın olgunluk paketi"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPLv3" }
keywords = ["ai", "agent", "self-improvement", "maturity"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
mehmet = "mehmet.cli:main"

[tool.setuptools.packages.find]
include = ["mehmet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"